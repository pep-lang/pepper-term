[package]
name = "term"
version = "1.4.0"
description = "Interactive terminals: raw mode, key and mouse input, bracketed paste, the clipboard, line editing with history, cursor control and colors"
license = "Apache-2.0"
repository = "https://github.com/pep-lang/pepper-term"
# The oldest Pepper toolchain that builds the package (0.11 added the
# panic hook): CI also tests with it, and `pepper package` skips a version
# whose minimum is newer than the user's toolchain.
minimum_toolchain = "0.11.0"
